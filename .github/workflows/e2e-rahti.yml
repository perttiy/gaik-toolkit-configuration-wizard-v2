name: E2E smoke — Rahti dev

# Runs the environment-agnostic smoke spec (e2e/smoke.spec.ts) against the
# live Rahti dev deployment instead of a locally-spun-up server.
#
# IMPORTANT: Rahti is deployed manually today (S8-9 — automated CI/CD image
# build -> Rahti registry -> rolling deploy — is Sprint 8 scope, not built
# yet). A push to `dev` does NOT redeploy Rahti. The `push` trigger below is
# a periodic smoke check of whatever is *currently live* on Rahti, not a
# verification of the pushed commit specifically — redeploy manually, then
# use "Run workflow" (workflow_dispatch) to check the new deployment.
#
# Not added as a required status check anywhere, so a failure here never
# blocks a PR or a push — it's purely a signal.

on:
  push:
    branches: [dev]
    paths:
      - "implementation_layer/solution_wizard_v2/e2e/smoke.spec.ts"
      - "implementation_layer/solution_wizard_v2/e2e/helpers/**"
      - ".github/workflows/e2e-rahti.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test against"
        required: false
        default: "https://wizard-v2-web-gaik.2.rahtiapp.fi"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: implementation_layer/solution_wizard_v2/package-lock.json
      - name: Install UI deps
        working-directory: implementation_layer/solution_wizard_v2
        run: npm ci
      - name: Install Playwright browsers
        working-directory: implementation_layer/solution_wizard_v2
        run: npx playwright install chromium --with-deps
      - name: Smoke test against Rahti dev
        working-directory: implementation_layer/solution_wizard_v2
        env:
          CI: "true"
          PLAYWRIGHT_SKIP_WEBSERVER: "true"
          PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url || vars.RAHTI_E2E_URL || 'https://wizard-v2-web-gaik.2.rahtiapp.fi' }}
        run: npx playwright test e2e/smoke.spec.ts --workers=1 --reporter=github,html
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-rahti
          path: implementation_layer/solution_wizard_v2/playwright-report/
          retention-days: 14
